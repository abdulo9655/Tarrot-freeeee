
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taro hub by Aumboon</title>
  <meta name="theme-color" content="#500a13">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #ffe9b0;
      font-family: system-ui, sans-serif;
      background:
        radial-gradient(ellipse at top, #8d2525 0%, transparent 55%),
        linear-gradient(145deg, #210509, #570b18 55%, #170306);
    }
    .panel {
      width: min(100%, 560px);
      text-align: center;
      padding: 36px 24px;
      border: 1px solid #d9ae57;
      border-radius: 24px;
      background: #30080de8;
      box-shadow: 0 0 55px #e3aa3030;
    }
    .symbol {
      font-size: 54px;
      margin-bottom: 8px;
    }
    h1 {
      color: #f8d889;
      font-size: clamp(27px, 6vw, 40px);
      margin: 8px 0;
    }
    .subtitle {
      color: #e9cda4;
      line-height: 1.8;
      margin-bottom: 28px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 17px;
      margin-top: 14px;
      border: 1px solid #f8d889;
      border-radius: 14px;
      background: linear-gradient(135deg, #f8df9b, #c38b32);
      color: #38070c;
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 22px #e7bd6655;
    }
    .secondary {
      color: #f8d889;
      background: transparent;
    }
    .note {
      font-size: 12px;
      color: #c9a8a0;
      margin-top: 24px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="symbol">✦ 🔮 ✦</div>
    <h1>Taro hub</h1>
    <div class="subtitle">
      by Aumboon<br>
      ขอให้ทุกคำถามนำไปสู่มุมมองใหม่ ๆ<br>
      ระบบจองคิวและตรวจสอบคิว
    </div>

    <a class="btn" id="openBooking" target="_blank"
       rel="noopener noreferrer">
      ✨ เข้าสู่ระบบจองคิว
    </a>

    <a class="btn secondary" id="openAdmin" target="_blank"
       rel="noopener noreferrer">
      ♛ เปิดระบบจัดการคิว
    </a>

    <div class="note">
      ระบบจองคิว • ตรวจสอบคิว • จัดการคิว<br>
      หากระบบไม่เปิด กรุณาตรวจสอบสิทธิ์การเข้าถึง Web App
    </div>
  </main>

  <script>
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbyzgpouhg-DCH8C-RP98z4rNdB5P8K9UuGL9qxAFG-dq39cy71fuYNyxFDhaS11SZJfFg/exec";

    document.getElementById("openBooking").href = APP_URL;
    document.getElementById("openAdmin").href = APP_URL;
  </script>
</body>
</html>
