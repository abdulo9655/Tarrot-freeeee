
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#26091d">
<title>TAROT HUB BY AUMBOON</title>
<style>
:root{--gold:#f7d58a;--cream:#fff3dc}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,"Noto Sans Thai",sans-serif;background:#180812;color:var(--cream)}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden}
.hero{position:fixed;inset:0;background-image:linear-gradient(180deg,#18051255,#180512dd),url("temple.png");background-size:cover;background-position:center;animation:zoom 22s ease-in-out infinite alternate}
.shade{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 15%,#10030b88 100%);pointer-events:none}
main{position:relative;z-index:1;width:min(900px,92vw);padding:30px 18px;text-align:center;animation:appear 1.2s ease both}
.lotus{font-size:60px;color:var(--gold);text-shadow:0 0 28px #f7c75b;animation:glow 3s infinite}
.brand{font-size:clamp(34px,8vw,76px);font-weight:bold;letter-spacing:.12em;color:#ffe5a3;text-shadow:0 4px 24px #000,0 0 24px #c18a36;line-height:1.2;margin:12px 0}
.by{font-size:clamp(13px,2vw,20px);letter-spacing:.3em;color:var(--gold)}
.rule{width:min(330px,70%);height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:25px auto}
h2{font-size:clamp(25px,5vw,43px);color:#ffe0a0;margin:12px 0;text-shadow:0 3px 15px #000}
p{line-height:1.9;text-shadow:0 2px 8px #000}
.english{font-style:italic;color:#f4d6a0}
.loader{width:42px;height:42px;border:3px solid #ffdf9d44;border-top-color:var(--gold);border-right-color:var(--gold);border-radius:50%;margin:25px auto 14px;animation:spin 1s linear infinite}
.loading{font-size:12px;letter-spacing:.15em;color:#f5d9a0}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:25px}
a{display:inline-block;text-decoration:none;font-weight:bold;border-radius:999px;padding:13px 23px;transition:.2s}
a:hover{transform:translateY(-3px);box-shadow:0 0 24px #e6b75b66}
.primary{background:linear-gradient(135deg,#ffebae,#c58a35);color:#321020}
.secondary{border:1px solid #f2d18b;color:#fff1cf;background:#26091d99}
footer{font-size:11px;color:#f0d4a1;margin-top:28px;letter-spacing:.08em}
.petal{position:fixed;top:-10vh;z-index:0;color:#ffd1df;opacity:.75;animation:fall linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes zoom{from{transform:scale(1.02)}to{transform:scale(1.12)}}
@keyframes appear{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{50%{filter:drop-shadow(0 0 16px #ffcc5c)}}
@keyframes fall{to{transform:translateY(115vh) rotate(420deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="hero"></div>
<div class="shade"></div>

<main>
  <div class="lotus">❀</div>
  <div class="brand">TAROT HUB</div>
  <div class="by">BY AUMBOON</div>
  <div class="rule"></div>

  <h2>เว็บไซต์ชั่วคราว</h2>
  <p>ขณะนี้เว็บไซต์อยู่ระหว่างการปรับปรุงระบบ</p>
  <p>ขอบคุณที่แวะมาเยือนเทวาลัยของเรา<br>สามารถกดปุ่มด้านล่างเพื่อเข้าสู่เว็บไซต์ได้</p>
  <p class="english">Thank you for your patience</p>

  <div class="loader"></div>
  <div class="loading">PREPARING YOUR JOURNEY…</div>

  <div class="actions">
    <a class="primary"
       href="https://script.google.com/macros/s/AKfycbw_YYeNM7i5m4S16QRh_NAXzMd1HF3Ufg_-y1cViyat2v-nzqEfAdcS3bdr13IMz86p4w/exec"
       target="_blank" rel="noopener">
       เข้าสู่เว็บไซต์ ✦
    </a>
    <a class="secondary"
       href="https://script.google.com/macros/s/AKfycbw_YYeNM7i5m4S16QRh_NAXzMd1HF3Ufg_-y1cViyat2v-nzqEfAdcS3bdr13IMz86p4w/exec">
       เปิดในหน้านี้
    </a>
  </div>

  <footer>🪷 TAROT HUB BY AUMBOON · A TEMPLE OF MYSTERY 🪷</footer>
</main>

<script>
const petals=['✿','❀','✧','✦'];
for(let i=0;i<22;i++){
  const p=document.createElement('span');
  p.className='petal';
  p.textContent=petals[i%petals.length];
  p.style.left=Math.random()*100+'%';
  p.style.animationDuration=9+Math.random()*12+'s';
  p.style.animationDelay=-Math.random()*18+'s';
  p.style.fontSize=10+Math.random()*15+'px';
  document.body.appendChild(p);
}
</script>
</body>
</html>
