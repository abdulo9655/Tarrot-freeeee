<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Tarot Queue 🔮</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at top,
      #5b21b6 0%,
      #24104f 35%,
      #090617 75%
    );

  color: white;
}

body::before {
  content: "✦  ✧  ⋆  ✦  ✧  ⋆  ✦  ✧";
  position: fixed;
  inset: 0;
  font-size: 40px;
  line-height: 100px;
  letter-spacing: 30px;
  opacity: .08;
  pointer-events: none;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 20px 15px 50px;
}

.header {
  text-align: center;
  padding: 25px 10px 15px;
}

.moon {
  font-size: 55px;
  margin-bottom: 5px;
}

.header h1 {
  margin: 0;
  font-size: 31px;
}

.header p {
  opacity: .75;
  margin-top: 8px;
}

.status-card {
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.16);
  backdrop-filter: blur(18px);
  border-radius: 24px;
  padding: 18px;
  margin-bottom: 18px;
  text-align: center;
}

.status-title {
  opacity: .7;
  font-size: 13px;
}

.current {
  font-size: 35px;
  font-weight: 800;
  margin: 5px;
}

.stats {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.stat {
  flex: 1;
  background: rgba(0,0,0,.20);
  border-radius: 16px;
  padding: 12px 5px;
}

.stat strong {
  display: block;
  font-size: 21px;
}

.stat span {
  font-size: 11px;
  opacity: .65;
}

.notice {
  padding: 14px;
  border-radius: 16px;
  background: rgba(255,255,255,.08);
  margin-bottom: 18px;
  font-size: 13px;
  line-height: 1.6;
}

.closed {
  border: 1px solid rgba(248,113,113,.4);
  background: rgba(127,29,29,.25);
}

.open {
  border: 1px solid rgba(74,222,128,.3);
  background: rgba(20,83,45,.2);
}

.form-card {
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.15);
  backdrop-filter: blur(20px);
  border-radius: 25px;
  padding: 20px;
}

label {
  display: block;
  margin: 13px 0 7px;
  font-size: 13px;
  opacity: .8;
}

input {
  width: 100%;
  padding: 15px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 14px;
  background: rgba(0,0,0,.20);
  color: white;
  outline: none;
  font-size: 16px;
}

input:focus {
  border-color: #c084fc;
}

.type-title {
  margin-top: 20px;
  font-size: 14px;
  opacity: .8;
}

.types {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 10px;
}

.type {
  padding: 18px 10px;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(0,0,0,.16);
  cursor: pointer;
  text-align: center;
}

.type.selected {
  border-color: #c084fc;
  background: rgba(126,34,206,.30);
}

.type-icon {
  font-size: 30px;
}

.type-name {
  font-weight: 700;
  margin-top: 5px;
}

.type-price {
  font-size: 13px;
  opacity: .7;
  margin-top: 4px;
}

button {
  width: 100%;
  border: 0;
  padding: 17px;
  border-radius: 16px;
  margin-top: 18px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  background: linear-gradient(
    135deg,
    #c084fc,
    #7c3aed
  );
  color: white;
  box-shadow: 0 10px 30px rgba(124,58,237,.3);
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.result {
  display: none;
  margin-top: 20px;
}

.ticket {
  position: relative;
  overflow: hidden;
  border-radius: 25px;
  padding: 25px 20px;
  background:
    linear-gradient(
      145deg,
      #ffffff,
      #f3e8ff
    );
  color: #24104f;
  text-align: center;
}

.ticket::after {
  content: "✦";
  position: absolute;
  right: 15px;
  top: 5px;
  font-size: 100px;
  opacity: .08;
}

.ticket-type {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
}

.ticket-queue {
  font-size: 52px;
  font-weight: 900;
  margin: 8px 0;
}

.ticket-name {
  font-weight: 700;
}

.ticket-info {
  margin-top: 15px;
  padding-top: 15px;
  border-top: 1px dashed #b9a4ce;
  font-size: 13px;
  line-height: 1.8;
}

.ticket-warning {
  margin-top: 12px;
  padding: 10px;
  border-radius: 12px;
  background: #f3e8ff;
  font-size: 12px;
}

.refresh {
  text-align: center;
  opacity: .5;
  font-size: 11px;
  margin-top: 15px;
}

@media (max-width: 390px) {
  .types {
    grid-template-columns: 1fr;
  }

  .header h1 {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="moon">🔮</div>
    <h1>Tarot Queue</h1>
    <p>ระบบจองคิวดูดวงไพ่ทาโร่</p>
  </div>

  <div class="status-card">

    <div class="status-title">
      คิวที่กำลังให้บริการ
    </div>

    <div
      class="current"
      id="currentQueue"
    >
      -
    </div>

    <div class="stats">

      <div class="stat">
        <strong id="waiting">0</strong>
        <span>คิวรอ</span>
      </div>

      <div class="stat">
        <strong id="estimate">0</strong>
        <span>นาทีโดยประมาณ</span>
      </div>

    </div>

  </div>

  <div
    id="notice"
    class="notice open"
  >
    🟢 ขณะนี้เปิดรับคิว
  </div>

  <div class="form-card">

    <h2 style="margin-top:0">
      🎫 จองคิว
    </h2>

    <label>ชื่อ</label>
    <input
      id="name"
      type="text"
      placeholder="ชื่อของคุณ"
      autocomplete="name"
    >

    <label>LINE</label>
    <input
      id="line"
      type="text"
      placeholder="@LINE หรือชื่อ LINE"
    >

    <label>เบอร์ติดต่อ</label>
    <input
      id="phone"
      type="tel"
      placeholder="08xxxxxxxx"
      inputmode="tel"
    >

    <div class="type-title">
      เลือกประเภทคิว
    </div>

    <div class="types">

      <div
        class="type selected"
        data-type="free"
        onclick="selectType('free')"
      >
        <div class="type-icon">🆓</div>
        <div class="type-name">
          คิวฟรี
        </div>
        <div class="type-price">
          0 บาท
        </div>
      </div>

      <div
        class="type"
        data-type="fast"
        onclick="selectType('fast')"
      >
        <div class="type-icon">⚡</div>
        <div class="type-name">
          ลัดคิว
        </div>
        <div
          class="type-price"
          id="fastPrice"
        >
          20 บาท
        </div>
      </div>

    </div>

    <button
      id="bookButton"
      onclick="bookQueue()"
    >
      🔮 จองคิว
    </button>

    <div
      id="result"
      class="result"
    ></div>

  </div>

  <div class="refresh">
    ระบบอัปเดตสถานะคิวอัตโนมัติ
  </div>

</div>

<script>

/* =========================================
   ใส่ URL Web App ของ Google Apps Script
   ========================================= */

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxsMqnS7WXoShHPUI0k6PDopktIMmS_roNjJINMcgP1E0RubFn6R0mh_Fc3UMP--7dTfg/exec";


let selectedType = "free";
let accepting = true;
let fastPrice = 20;


/**
 * JSONP
 */
function api(params) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "jsonp_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 10000);

    const script =
      document.createElement("script");

    const query =
      new URLSearchParams({
        ...params,
        callback: callbackName
      });

    script.src =
      SCRIPT_URL +
      "?" +
      query.toString();

    window[callbackName] =
      function(data) {

        resolve(data);

        delete window[callbackName];

        script.remove();
      };

    script.onerror =
      function() {

        reject(
          new Error(
            "ไม่สามารถเชื่อมต่อระบบได้"
          )
        );

        delete window[callbackName];

        script.remove();
      };

    document.body.appendChild(script);

  });
}


/**
 * เลือกประเภทคิว
 */
function selectType(type) {

  selectedType = type;

  document
    .querySelectorAll(".type")
    .forEach(el => {

      el.classList.remove(
        "selected"
      );

      if (
        el.dataset.type === type
      ) {
        el.classList.add(
          "selected"
        );
      }
    });

  const button =
    document.getElementById(
      "bookButton"
    );

  if (type === "free") {

    button.innerHTML =
      "🆓 จองคิวฟรี";

  } else {

    button.innerHTML =
      "⚡ จองคิวลัด " +
      fastPrice +
      " บาท";
  }
}


/**
 * โหลดสถานะ
 */
async function loadStatus() {

  try {

    const data =
      await api({
        action: "status"
      });

    if (!data.success) {
      return;
    }

    accepting =
      data.accepting;

    fastPrice =
      data.fastPrice || 20;

    document.getElementById(
      "currentQueue"
    ).textContent =
      data.currentQueue || "-";

    document.getElementById(
      "waiting"
    ).textContent =
      data.waiting || 0;

    document.getElementById(
      "estimate"
    ).textContent =
      data.estimatedMinutes || 0;

    document.getElementById(
      "fastPrice"
    ).textContent =
      fastPrice + " บาท";

    updateOpenClose();

  } catch (err) {

    console.log(err);

  }
}


/**
 * เปิด / ปิดรับคิว
 */
function updateOpenClose() {

  const notice =
    document.getElementById(
      "notice"
    );

  const button =
    document.getElementById(
      "bookButton"
    );

  if (accepting) {

    notice.className =
      "notice open";

    notice.innerHTML =
      "🟢 ขณะนี้เปิดรับคิว";

    button.disabled = false;

  } else {

    notice.className =
      "notice closed";

    notice.innerHTML =
      "🔒 <b>ขณะนี้ปิดรับคิว</b><br>" +
      "ขณะนี้ยังไม่เปิดรับการจองคิวใหม่";

    button.disabled = true;
  }
}


/**
 * จองคิว
 */
async function bookQueue() {

  if (!accepting) {

    alert(
      "ขณะนี้ปิดรับคิว"
    );

    return;
  }

  const name =
    document
      .getElementById("name")
      .value
      .trim();

  const line =
    document
      .getElementById("line")
      .value
      .trim();

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();

  if (!name || !line || !phone) {

    alert(
      "กรุณากรอกชื่อ LINE และเบอร์ติดต่อให้ครบ"
    );

    return;
  }

  if (phone.length < 8) {

    alert(
      "กรุณาตรวจสอบเบอร์ติดต่อ"
    );

    return;
  }

  const button =
    document.getElementById(
      "bookButton"
    );

  button.disabled = true;

  button.innerHTML =
    "⏳ กำลังจองคิว...";

  try {

    const data =
      await api({

        action: "book",

        name: name,

        line: line,

        phone: phone,

        type: selectedType

      });

    if (!data.success) {

      if (data.duplicate) {

        alert(
          "เบอร์นี้มีคิวอยู่แล้ว\nเลขคิว: " +
          data.queue
        );

      } else {

        alert(
          data.message ||
          "ไม่สามารถจองคิวได้"
        );
      }

      button.disabled = false;

      selectType(
        selectedType
      );

      return;
    }

    showTicket(data);

    loadStatus();

  } catch (err) {

    alert(
      "เกิดข้อผิดพลาดในการเชื่อมต่อ"
    );

    button.disabled = false;

    selectType(
      selectedType
    );
  }
}


/**
 * แสดงบัตรคิว
 */
function showTicket(data) {

  const result =
    document.getElementById(
      "result"
    );

  const isFast =
    data.type === "ลัดคิว";

  result.innerHTML = `

    <div class="ticket">

      <div class="ticket-type">
        ${
          isFast
            ? "⚡ FAST QUEUE"
            : "🆓 FREE QUEUE"
        }
      </div>

      <div class="ticket-queue">
        ${escapeHtml(data.queue)}
      </div>

      <div class="ticket-name">
        ${escapeHtml(data.name)}
      </div>

      <div class="ticket-info">

        ประเภท:
        <b>
          ${escapeHtml(data.type)}
        </b>

        <br>

        ตำแหน่งโดยประมาณ:
        <b>
          ${data.position}
        </b>

        <br>

        เวลารอโดยประมาณ:
        <b>
          ${data.estimatedMinutes}
          นาที
        </b>

      </div>

      ${
        isFast
          ? `
            <div class="ticket-warning">
              ⚡ คิวลัด ${data.price} บาท<br>
              <b>ชำระเงินตอนติดต่อดูดวง</b><br>
              บัตรนี้เป็นบัตรยืนยันคิว
              ไม่ใช่หลักฐานการชำระเงิน
            </div>
          `
          : `
            <div class="ticket-warning">
              🆓 คิวนี้ไม่มีค่าใช้จ่าย<br>
              แคปหน้าจอนี้ไว้เพื่อใช้ยืนยันคิว
            </div>
          `
      }

    </div>

    <button
      onclick="window.scrollTo({
        top: 0,
        behavior: 'smooth'
      })"
    >
      🔝 กลับด้านบน
    </button>
  `;

  result.style.display =
    "block";

  result.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}


/**
 * ป้องกัน HTML injection
 */
function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/**
 * เริ่มต้นระบบ
 */
selectType("free");

loadStatus();

setInterval(
  loadStatus,
  15000
);

</script>

</body>
</html>
